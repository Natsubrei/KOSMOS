name: kosmos-qemu

# The test stack: one unprivileged QEMU guest plus the server the agent talks
# to. The guest's only path to the server is QEMU user-mode networking — the
# guest connects to the QEMU host alias 10.0.2.2:8080, which the guest-host
# container relays to the server service.
services:
  server:
    image: debian:bookworm-slim
    command: ["/state/bin/kosmos-server", "-listen", ":8080"]
    volumes:
      - ../../.runbin/qemu:/state:ro
    ports:
      - 127.0.0.1:${KOSMOS_SERVER_PORT:-8080}:8080

  guest:
    build:
      context: .
      # A proxy bound to the host loopback is unreachable from the default
      # build network; set KOSMOS_BUILD_NETWORK=host in that case.
      network: ${KOSMOS_BUILD_NETWORK:-default}
    depends_on:
      - server
    # The whole privilege story: /dev/kvm and nothing else.
    devices:
      - /dev/kvm
    group_add:
      - ${KOSMOS_KVM_GID:-0}
    ports:
      - 127.0.0.1:${KOSMOS_SSH_PORT:-2222}:2222
    volumes:
      - ../../.runbin/qemu:/state
    environment:
      KOSMOS_GUEST_IMAGE: ${KOSMOS_GUEST_IMAGE:-openEuler}
      KOSMOS_GUEST_CPUS: ${KOSMOS_GUEST_CPUS:-2}
      KOSMOS_GUEST_MEMORY_MB: ${KOSMOS_GUEST_MEMORY_MB:-2048}
      KOSMOS_SERVER_ADDR: server:8080
    healthcheck:
      test:
        - CMD
        - ssh
        - -i
        - /state/ssh/id_ed25519
        - -p
        - "2222"
        - -o
        - BatchMode=yes
        - -o
        - StrictHostKeyChecking=no
        - -o
        - UserKnownHostsFile=/dev/null
        - -o
        - ConnectTimeout=3
        - -o
        - LogLevel=ERROR
        - kosmos@127.0.0.1
        - "true"
      interval: 5s
      timeout: 8s
      retries: 60
      start_period: 60s
    stop_grace_period: 20s
